name: Publish Hassan PS4 Host
on:
  push:
    branches: [main]
    paths: ["Hassan-PS4-Host.zip", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Extract and validate reviewed project
        run: |
          python -m zipfile -e Hassan-PS4-Host.zip /tmp/hassan-source
          python /tmp/hassan-source/hassan-ps4-host/scripts/check.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/hassan-source/hassan-ps4-host/docs
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
